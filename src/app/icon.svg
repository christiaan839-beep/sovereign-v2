<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030303"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="50%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6ee7b7;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Outer hexagon frame -->
  <polygon points="256,52 432,156 432,356 256,460 80,356 80,156" fill="none" stroke="url(#emerald)" stroke-width="8" opacity="0.4"/>
  <!-- Inner hexagon -->
  <polygon points="256,100 392,180 392,332 256,412 120,332 120,180" fill="none" stroke="url(#emerald)" stroke-width="4" opacity="0.2"/>
  <!-- S letterform -->
  <path d="M310,170 C310,170 340,170 340,200 C340,230 300,235 270,240 C240,245 200,250 200,280 C200,310 230,320 260,320 L300,320"
        fill="none" stroke="url(#emerald)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Corner dots -->
  <circle cx="256" cy="52" r="6" fill="#34d399" opacity="0.8"/>
  <circle cx="432" cy="156" r="6" fill="#34d399" opacity="0.6"/>
  <circle cx="432" cy="356" r="6" fill="#34d399" opacity="0.6"/>
  <circle cx="256" cy="460" r="6" fill="#34d399" opacity="0.8"/>
  <circle cx="80" cy="356" r="6" fill="#34d399" opacity="0.6"/>
  <circle cx="80" cy="156" r="6" fill="#34d399" opacity="0.6"/>
</svg>
