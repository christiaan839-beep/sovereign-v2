name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in engines, and current LTS.
        node: ["18.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Quickstart runs
        run: npm run example

      - name: MCP server answers a real handshake
        # Guards the seam the README promises: a client must be able to
        # initialize, send `notifications/initialized`, and list tools.
        # A reply to that notification is a protocol violation, so the
        # response count is asserted, not just the contents.
        run: |
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node dist/mcp.js > handshake.jsonl
          test "$(wc -l < handshake.jsonl)" -eq 2
          grep -q '"protocolVersion":"2025-06-18"' handshake.jsonl
          grep -q 'build_annex_iv' handshake.jsonl
          echo "MCP handshake OK"

      - name: Package contains only what it should
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const [p] = require('./pack.json');
            const files = p.files.map(f => f.path);
            const stray = files.filter(f => !/^(dist\/|README\.md$|LICENSE$|package\.json$)/.test(f));
            if (stray.length) { console.error('unexpected files in tarball:', stray); process.exit(1); }
            if (!files.includes('dist/mcp.js')) { console.error('missing dist/mcp.js'); process.exit(1); }
            console.log('tarball OK —', files.length, 'files,', p.size, 'bytes');
          "
