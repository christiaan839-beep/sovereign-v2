name: Sovereign Matrix CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run strict TypeScript check (noEmit)
        # The Build job (below) uses Next.js's `ignoreBuildErrors: true` to tolerate
        # dynamic-icon edge cases. But we want a SEPARATE strict gate that does NOT
        # tolerate errors, so a clean `tsc --noEmit` is required for every PR.
        # If this ever flags a legit dynamic-only case, narrow the fix (declare a
        # type, add a cast with a comment) rather than loosen this gate.
        run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  anti-drift:
    # weekly-health.mjs is the anti-drift machine — 162 invariants that
    # check artifact presence, wiring content, and quality metrics
    # (test count, eval coverage, lint budget, security wiring, etc.).
    # Running it on every PR means a future change that silently deletes
    # a security artifact (pii-guard.ts, audit-log hash chain, etc.) or
    # reverts a wiring line (evaluateScope, scrubPiiDeep, FREE_ONLY_MODE)
    # blocks the merge instead of slipping through.
    #
    # The script exits 1 on any regression, so this job naturally fails
    # the PR when invariants break.
    name: Anti-Drift Invariants
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run weekly-health invariants (162 checks)
        run: node scripts/weekly-health.mjs

      - name: Run dependency rot detector (vulns + outdated majors)
        # Blocks PRs that introduce HIGH/CRITICAL CVEs (Round 22 shipped
        # 2 CRITICALs precisely because nothing blocked them). Tolerates
        # moderate vulns + up to 10 outdated majors as background noise.
        # See scripts/dep-rot-detector.mjs THRESHOLDS for tuning.
        run: node scripts/dep-rot-detector.mjs --check

      - name: Run CHANGELOG drift check (informational)
        # Reports >5 user-facing commits since last CHANGELOG entry.
        # NON-BLOCKING for now (uses `|| true`) until the team adopts
        # Conventional Commits across the board. Promote to a hard
        # gate once `feat:`/`fix:` prefixes are standard.
        run: node scripts/generate-changelog.mjs --check || true

  reliability:
    # Dedicated job for the reliability + safety test suites added in
    # the phase-1 hardening sprint. These are fast, deterministic,
    # offline tests — no provider keys needed — so they also serve as
    # a required status check that gates main merges on:
    #   - with-timeout invariants
    #   - ai-parse JSON extraction + repair
    #   - degradation mode behaviour
    #   - confidence gate threshold logic
    #   - NemoGuard safety pipeline (input + output checks, hashing,
    #     Sovereign-tier skip gate)
    #   - per-endpoint rate-limit rule matcher + window enforcement
    #   - Stripe dedup state-machine
    #   - model routing (sovereignty-aware)
    name: Reliability Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run reliability + safety + rate-limit + dedup + routing tests
        run: >
          npx vitest run
          src/lib/__tests__/reliability.test.ts
          src/lib/__tests__/safety-pipeline.test.ts
          src/lib/__tests__/rate-limits.test.ts
          src/lib/__tests__/stripe-dedup.test.ts
          src/lib/__tests__/model-routing.test.ts
          --reporter=verbose

  e2e:
    # End-to-end tests via Playwright. Boots a production build of the app,
    # runs against http://localhost:3000. Catches real user-flow regressions
    # that unit tests can't — e.g. "the landing page stopped rendering the hero"
    # or "the compare page crashes because SLO endpoint changed shape".
    #
    # Keeps ~2 min on GitHub Actions, well under the PR turnaround budget.
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # The E2E suite deliberately tests graceful-degradation paths,
          # so no DATABASE_URL is set here — the app must render without it.

      - name: Run Playwright tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sovereign-matrix:${{ github.sha }} .
