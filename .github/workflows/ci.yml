name: Sovereign Matrix CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # Strict type-check: next.config.ts has `ignoreBuildErrors: false`,
      # so type errors break the build. CI catches them earlier here.
      - name: Type check
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

  migration-parity:
    name: Migration Parity
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    # Only run when DATABASE_URL_READONLY is configured. Use a *read-only*
    # Neon role here — never the same credential the app deploys with.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify schema vs Neon (soft until baseline established)
        run: npm run check:migrations:soft
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_READONLY }}

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: build
    # Smoke runs against the THIS-PR build via `next start` on localhost.
    # This catches regressions introduced by the PR even when the test
    # spec changes faster than the deployed preview. Bug history: smoke
    # used to default to https://sovereignmatrix.agency (PROD) when the
    # E2E_PREVIEW_URL secret wasn't set — meaning a PR's test spec
    # would assert against the deployed PROD UI, not the PR's UI.
    # Locked to localhost so the PR is testing itself.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build the app for the smoke run
        # Same env shape as the Build job — dummy values are fine since
        # smoke doesn't sign in or hit Stripe; the build needs them only
        # so NEXT_PUBLIC_* keys aren't compiled as undefined.
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_smoke_dummy' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_smoke_dummy' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://x:y@localhost:5432/test' }}

      - name: Start next server in background
        run: |
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_smoke_dummy' }}" \
          CLERK_SECRET_KEY="${{ secrets.CLERK_SECRET_KEY || 'sk_test_smoke_dummy' }}" \
          DATABASE_URL="${{ secrets.DATABASE_URL || 'postgresql://x:y@localhost:5432/test' }}" \
          PORT=3000 npm start > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health/ping > /dev/null 2>&1; then
              echo "next ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "next did not become ready in 60s; tail of log:"
          tail -50 /tmp/next.log
          exit 1

      - name: Run golden-path smoke tests
        run: npm run smoke
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_REQUIRE_READY: 'false'

      - name: Show next.log on failure
        if: failure()
        run: tail -200 /tmp/next.log || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sovereign-matrix:${{ github.sha }} .
