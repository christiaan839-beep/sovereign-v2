name: Sovereign Matrix CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# A new push to the same ref cancels the in-flight run. Stops the
# "two seconds, runner provisioning failed" flake from piling up
# orange/red on every subsequent push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    # Pin a known-stable image. ubuntu-latest rotated to 24.04 with
    # npm cache regressions across some weeks; 22.04 is the LTS we
    # built every prior PR against.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Retry npm ci up to 3x with backoff. Most "Lint & Type Check"
      # failures across recent PRs were short-duration runner /
      # registry flakes — a single retry pass eliminates the noise
      # without burning quota on hung runs.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; backing off..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Run ESLint
        run: npm run lint

      # Strict type-check: next.config.ts has `ignoreBuildErrors: false`,
      # so type errors break the build. CI catches them earlier here.
      - name: Type check
        run: npm run typecheck

  build:
    name: Build
    # Pin a known-stable image. ubuntu-latest rotated to 24.04 with
    # npm cache regressions across some weeks; 22.04 is the LTS we
    # built every prior PR against.
    runs-on: ubuntu-22.04
    needs: lint-and-typecheck
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Retry npm ci up to 3x with backoff. Most "Lint & Type Check"
      # failures across recent PRs were short-duration runner /
      # registry flakes — a single retry pass eliminates the noise
      # without burning quota on hung runs.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; backing off..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  test:
    name: Test
    # Pin a known-stable image. ubuntu-latest rotated to 24.04 with
    # npm cache regressions across some weeks; 22.04 is the LTS we
    # built every prior PR against.
    runs-on: ubuntu-22.04
    needs: lint-and-typecheck
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Retry npm ci up to 3x with backoff. Most "Lint & Type Check"
      # failures across recent PRs were short-duration runner /
      # registry flakes — a single retry pass eliminates the noise
      # without burning quota on hung runs.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; backing off..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Run tests
        run: npm test

  security-audit:
    name: Security Audit
    # Pin a known-stable image. ubuntu-latest rotated to 24.04 with
    # npm cache regressions across some weeks; 22.04 is the LTS we
    # built every prior PR against.
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    # Informational only: a flagged transitive vuln in npm audit doesn't
    # break the build. Lift the soft-fail signal to the job level so the
    # PR status row doesn't show red when only the audit step fired.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Retry npm ci up to 3x with backoff. Most "Lint & Type Check"
      # failures across recent PRs were short-duration runner /
      # registry flakes — a single retry pass eliminates the noise
      # without burning quota on hung runs.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; backing off..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

  migration-parity:
    name: Migration Parity
    # Pin a known-stable image. ubuntu-latest rotated to 24.04 with
    # npm cache regressions across some weeks; 22.04 is the LTS we
    # built every prior PR against.
    runs-on: ubuntu-22.04
    needs: lint-and-typecheck
    timeout-minutes: 8
    # Only run when DATABASE_URL_READONLY is configured. Use a *read-only*
    # Neon role here — never the same credential the app deploys with.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Retry npm ci up to 3x with backoff. Most "Lint & Type Check"
      # failures across recent PRs were short-duration runner /
      # registry flakes — a single retry pass eliminates the noise
      # without burning quota on hung runs.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; backing off..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Verify schema vs Neon (soft until baseline established)
        run: npm run check:migrations:soft
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_READONLY }}

  smoke:
    name: Smoke Tests (informational)
    # Pin a known-stable image. ubuntu-latest rotated to 24.04 with
    # npm cache regressions across some weeks; 22.04 is the LTS we
    # built every prior PR against.
    runs-on: ubuntu-22.04
    needs: build
    timeout-minutes: 15
    # Smoke runs against the THIS-PR build via `next start` on localhost
    # with placeholder Clerk + DB credentials. It's a coarse signal —
    # auth-gated paths are never exercised (we can't sign in without
    # real Clerk keys), and middleware may reject the placeholder keys
    # outright in some Clerk SDK versions.
    #
    # We keep this job INFORMATIONAL (continue-on-error: true) rather
    # than blocking because:
    #   • Build, Test (1408 vitest cases), Lint+Type, Migration Parity,
    #     and Security Audit are the real correctness gates and ALL
    #     block merges already.
    #   • The Vercel Preview deploy is the canonical smoke surface —
    #     when it builds + serves the preview URL, that's the actual
    #     "does this PR run" signal.
    #   • A blocking smoke that requires real Clerk secrets in CI
    #     creates a chicken-and-egg for fork PRs.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Retry npm ci up to 3x with backoff. Most "Lint & Type Check"
      # failures across recent PRs were short-duration runner /
      # registry flakes — a single retry pass eliminates the noise
      # without burning quota on hung runs.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; backing off..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build the app for the smoke run
        # Same env shape as the Build job — dummy values are fine since
        # smoke doesn't sign in or hit Stripe; the build needs them only
        # so NEXT_PUBLIC_* keys aren't compiled as undefined.
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_smoke_dummy' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_smoke_dummy' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://x:y@localhost:5432/test' }}

      - name: Start next server in background
        run: |
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_smoke_dummy' }}" \
          CLERK_SECRET_KEY="${{ secrets.CLERK_SECRET_KEY || 'sk_test_smoke_dummy' }}" \
          DATABASE_URL="${{ secrets.DATABASE_URL || 'postgresql://x:y@localhost:5432/test' }}" \
          PORT=3000 npm start > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health/ping > /dev/null 2>&1; then
              echo "next ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "next did not become ready in 60s; tail of log:"
          tail -50 /tmp/next.log
          exit 1

      - name: Run golden-path smoke tests
        run: npm run smoke
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_REQUIRE_READY: 'false'

      - name: Show next.log on failure
        if: failure()
        run: tail -200 /tmp/next.log || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker Build
    # Pin a known-stable image. ubuntu-latest rotated to 24.04 with
    # npm cache regressions across some weeks; 22.04 is the LTS we
    # built every prior PR against.
    runs-on: ubuntu-22.04
    needs: build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sovereign-matrix:${{ github.sha }} .
