name: Sovereign Matrix CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Explicit minimum-viable permissions. Org-level "restrict default
# workflow permissions" can otherwise leave actions/checkout@v4
# without the contents:read scope it needs — manifesting as a
# 2-second job failure before npm ever runs. Cook 140 tests this
# theory; if the failures persist after this PR, the remaining
# plausible cause is Actions minutes exhaustion (verify at
# github.com/settings/billing).
permissions:
  contents: read
  actions: read

# A new push to the same ref cancels the in-flight run. Stops the
# "two seconds, runner provisioning failed" flake from piling up
# orange/red on every subsequent push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    # Pin a known-stable image. ubuntu-latest rotated to 24.04 with
    # npm cache regressions across some weeks; 22.04 is the LTS we
    # built every prior PR against.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Retry npm ci up to 3x with backoff. Most "Lint & Type Check"
      # failures across recent PRs were short-duration runner /
      # registry flakes — a single retry pass eliminates the noise
      # without burning quota on hung runs.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; backing off..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Run ESLint
        run: npm run lint

      # Strict type-check: next.config.ts has `ignoreBuildErrors: false`,
      # so type errors break the build. CI catches them earlier here.
      - name: Type check
        run: npm run typecheck

      # Wave-31: regenerator drift guard. Fails the build if the agent
      # registry on disk doesn't match the on-disk agent route folders.
      # Run `npm run gen:registry` locally to fix.
      - name: Agent registry drift check
        run: npm run check:registry

  build:
    name: Build
    # Pin a known-stable image. ubuntu-latest rotated to 24.04 with
    # npm cache regressions across some weeks; 22.04 is the LTS we
    # built every prior PR against.
    runs-on: ubuntu-22.04
    needs: lint-and-typecheck
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Retry npm ci up to 3x with backoff. Most "Lint & Type Check"
      # failures across recent PRs were short-duration runner /
      # registry flakes — a single retry pass eliminates the noise
      # without burning quota on hung runs.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; backing off..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  test:
    name: Test
    # Pin a known-stable image. ubuntu-latest rotated to 24.04 with
    # npm cache regressions across some weeks; 22.04 is the LTS we
    # built every prior PR against.
    runs-on: ubuntu-22.04
    needs: lint-and-typecheck
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Retry npm ci up to 3x with backoff. Most "Lint & Type Check"
      # failures across recent PRs were short-duration runner /
      # registry flakes — a single retry pass eliminates the noise
      # without burning quota on hung runs.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; backing off..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Run tests
        run: npm test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; backing off..."
            sleep $((attempt * 5))
          done
          exit 1

      # Blocking audit — high-severity transitive vulns must be addressed.
      # If a vendor advisory genuinely has no fix path, scope a temporary
      # `npm audit --json | jq` allowlist in a follow-up PR rather than
      # weakening this gate. Soft-fail audits are the audit-process bug
      # the security-reviewer flagged in May-2026.
      - name: Audit dependencies (blocking on high+)
        run: npm audit --audit-level=high

      # Generate a CycloneDX SBOM on every build for SOC 2 / supply-chain
      # transparency. Stored as an artifact for 90 days so audit evidence
      # is reproducible without re-running CI.
      - name: Generate SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm@1 --output-file sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      # Verify package provenance signatures where vendors ship them.
      # `npm audit signatures` is a best-effort check today (most packages
      # aren't signed yet) but it's a SOC 2 CC6.8 evidence line item.
      - name: Verify package signatures (best-effort)
        run: npm audit signatures || true

  # PR-only: surface added/changed dependencies and any new advisories
  # right on the diff, before the audit job even has to fail.

  migration-parity:
    name: Migration Parity
    # Pin a known-stable image. ubuntu-latest rotated to 24.04 with
    # npm cache regressions across some weeks; 22.04 is the LTS we
    # built every prior PR against.
    runs-on: ubuntu-22.04
    needs: lint-and-typecheck
    timeout-minutes: 8
    # Only run when DATABASE_URL_READONLY is configured. Use a *read-only*
    # Neon role here — never the same credential the app deploys with.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Retry npm ci up to 3x with backoff. Most "Lint & Type Check"
      # failures across recent PRs were short-duration runner /
      # registry flakes — a single retry pass eliminates the noise
      # without burning quota on hung runs.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; backing off..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Verify schema vs Neon (soft until baseline established)
        run: npm run check:migrations:soft
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_READONLY }}

          DATABASE_URL="${{ secrets.DATABASE_URL || 'postgresql://x:y@localhost:5432/test' }}" \
          PORT=3000 npm start > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health/ping > /dev/null 2>&1; then
              echo "next ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "next did not become ready in 60s; tail of log:"
          tail -50 /tmp/next.log
          exit 1

  docker:
    name: Docker Build
    # Pin a known-stable image. ubuntu-latest rotated to 24.04 with
    # npm cache regressions across some weeks; 22.04 is the LTS we
    # built every prior PR against.
    runs-on: ubuntu-22.04
    needs: build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sovereign-matrix:${{ github.sha }} .
