# OpenSSF Scorecard — supply-chain trust score, public on the badge.
#
# Runs the open-source-security-foundation/scorecard-action against
# this repository weekly + on every push to main. Produces a SARIF
# upload (visible in Security tab) and a numeric score (0–10) that
# the public badge in README.md reads from. Procurement teams looking
# at the repo see this score before they look at the code.
#
# Permissions are the documented minimum from
# https://github.com/ossf/scorecard-action#installation
#
# Cost: zero. Runs on a hosted ubuntu-latest runner.
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "21 7 * * 1" # weekly Monday 07:21 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF results
      id-token: write # publish results to OpenSSF
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the public OpenSSF results dataset so the
          # README badge stays current without another integration.
          publish_results: true

      - name: Upload Scorecard SARIF
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to GitHub code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
