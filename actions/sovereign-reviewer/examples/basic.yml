name: Sovereign Reviewer

# Drop this in .github/workflows/sovereign-review.yml to enable
# AI-powered PR review on your repo.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required — we need history for the diff

      - uses: sovereign-matrix/sovereign-reviewer@v1
        with:
          sovereign-api-key: ${{ secrets.SOVEREIGN_API_KEY }}
          # All other inputs have sensible defaults.
          # See action.yml for the full list.
