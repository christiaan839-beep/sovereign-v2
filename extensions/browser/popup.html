<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sovereign</title>
    <style>
      body {
        font-family: -apple-system, "Segoe UI", sans-serif;
        background: #050505;
        color: #eaeaea;
        width: 280px;
        padding: 18px;
      }
      h1 {
        font-size: 13px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin: 0 0 12px;
        font-weight: 400;
      }
      p {
        font-size: 12px;
        color: #999;
        margin: 0 0 12px;
      }
      a {
        color: #10b981;
        text-decoration: none;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>Sovereign Matrix</h1>
    <p>Select text on any page, right-click → <b>Run Sovereign agent on selection</b>.</p>
    <a href="#" id="open-options">Options →</a>
    <script>
      document.getElementById("open-options").addEventListener("click", (e) => {
        e.preventDefault();
        chrome.runtime.openOptionsPage();
      });
    </script>
  </body>
</html>
